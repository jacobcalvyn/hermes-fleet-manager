name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.6"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Go tests
        run: make test
      - name: Go vet
        run: go vet ./...
      - name: Web lint and build
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm run build
      - name: Compose config
        run: docker compose config --quiet
